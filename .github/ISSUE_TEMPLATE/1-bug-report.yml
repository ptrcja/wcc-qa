name: 🐞 Bug report
description: Report a problem with the test suite, framework, or tooling
title: "bug: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to file a bug report! Please fill the form in English.
  - type: checkboxes
    attributes:
      label: Is there an existing issue for this?
      description: Please search to see if an issue already exists for the bug you encountered.
      options:
        - label: I have searched the existing issues
          required: true
  - type: textarea
    attributes:
      label: Current behavior
      description: A clear and concise description of what is happening.
    validations:
      required: true
  - type: textarea
    attributes:
      label: Expected behavior
      description: A clear and concise description of what you expected to happen.
    validations:
      required: true
  - type: textarea
    attributes:
      label: Steps to reproduce
      description: Include the exact command you ran and any relevant console output, error, or screenshots.
      placeholder: |
        1. Run `npx playwright test ... --project=api`
        2. ...
        3. See error
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Affected area
      options:
        - API tests
        - Admin/UI tests
        - Fixtures / API service layer
        - Data factory / schemas
        - CI / tooling (ESLint, Prettier, Husky)
        - Other
    validations:
      required: true
  - type: textarea
    attributes:
      label: Environment
      description: OS, Node version (`node -v`), Playwright version (`npx playwright --version`), and browser if UI-related.
      placeholder: |
        - OS: macOS 15
        - Node: v20.x
        - Playwright: 1.x
        - Browser: chromium
    validations:
      required: true
  - type: textarea
    attributes:
      label: Additional context
      description: Anything else that might help — related issues/PRs, logs, or a proposed fix.
    validations:
      required: false
